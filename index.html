<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Lucide Icon -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <!-- CSS -->
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/flow.css">
  <title>AI Proposal Maker</title>
</head>

<body>
  <div id="app"></div>

  <!-- Error Handler for debugging -->
  <script>
    window.addEventListener('error', function (e) {
      document.body.innerHTML += `<div style="color:red; background:white; padding:1em; position:fixed; top:0; left:0; z-index:9999; border:2px solid red;">
        <h3>Error:</h3>
        <p>${e.message}</p>
        <p>at ${e.filename}:${e.lineno}</p>
      </div>`;
    });
  </script>

  <!-- Router and Main App Logic -->
  <script type="module" src="./js/router.js"></script>
</body>

</html>
